<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR code component</title>
    <link rel="stylesheet" href="./index.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../public/images/favicon-32x32.png"
    />
  </head>
  <body>
    <div id="root">
      <figure class="qr-code">
        <img src="../public/images/image-qr-code.png" alt="qr-code" />
        <figcaption>
          <p>
            <strong>Improve your front-end skills by building projects</strong>
          </p>
          <p>
            Scan the QR code to visit Frontend Mentor and take you coding skills
            to the next level
          </p>
        </figcaption>
      </figure>
    </div>
  </body>
</html>
